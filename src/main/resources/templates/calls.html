<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>シングル一覧</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header th:replace="fragments/header :: header"></header>
<div class="container">
    <aside th:replace="fragments/sidebar :: sidebar"></aside>
    <main>
        <h2>シングル一覧</h2>
        <ul>
            <li th:each="single : ${singles}">
                <a th:href="@{'/calls/' + ${single.number}}" th:text="${single.number} + '枚目 ' + ${single.name}"></a>
            </li>
        </ul>
    </main>
</div>
</body>
</html>
