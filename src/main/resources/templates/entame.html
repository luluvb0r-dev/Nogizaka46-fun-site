<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>円タメグラフ</title>
    <link rel="stylesheet" href="/css/entame-graph.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header th:replace="fragments/header :: header"></header>
<div class="container">
    <aside th:replace="fragments/sidebar :: sidebar"></aside>
    <main class="entame-main">
        <h2>円タメグラフ（画像風SVG）</h2>
        <p class="help">※ ボタンを押すと、TV風の“画像っぽい”レイアウト（SVG）を生成して表示します。</p>
        <div id="entame-form-container" class="form-container"></div>
        <div class="toolbar">
            <button id="entame-add-btn" type="button">フォーム追加</button>
            <button id="entame-generate-btn" type="button" disabled>円タメグラフ</button>
            <button id="entame-save-btn" type="button" disabled>画像保存</button>
        </div>
        <div id="entame-stage" class="entame-stage" aria-live="polite"></div>
    </main>
</div>
<div th:replace="fragments/footer :: footer-scripts"></div>
<script src="/js/entame-graph.js" defer></script>
</body>
</html>
